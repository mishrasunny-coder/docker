---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-frontend
  namespace: flask-app
  labels:
    app: streamlit-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit-frontend
  template:
    metadata:
      labels:
        app: streamlit-frontend
    spec:
      containers:
      - name: streamlit-app
        image: medium-flask-app-streamlit-frontend:latest
        imagePullPolicy: Never  # Use local images built by docker-compose
        command: ["/root/.local/bin/poetry", "run", "streamlit", "run", "/app/frontend.py", "--server.address", "0.0.0.0"]
        ports:
        - containerPort: 8501
          name: http
        env:
        - name: STREAMLIT_SERVER_PORT
          value: "8501"
        - name: STREAMLIT_SERVER_HEADLESS
          value: "true"
        - name: FLASK_BACKEND_URL
          value: "http://flask-backend-service:5000"  # Use Kubernetes service discovery
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        readinessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-frontend-service
  namespace: flask-app
  labels:
    app: streamlit-frontend
spec:
  type: NodePort
  ports:
  - port: 8501
    targetPort: 8501
    nodePort: 30002  # External access via minikube
    name: http
  selector:
    app: streamlit-frontend
