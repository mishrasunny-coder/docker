---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-backend
  namespace: flask-app
  labels:
    app: flask-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-backend
  template:
    metadata:
      labels:
        app: flask-backend
    spec:
      containers:
      - name: flask-app
        image: medium-flask-app-my-testing-app:latest
        imagePullPolicy: Never  # Use local images built by docker-compose
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLASK_APP
          value: "/app/app.py"
        - name: FLASK_RUN_HOST
          value: "0.0.0.0"
        - name: FLASK_RUN_PORT
          value: "5000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: flask-backend-service
  namespace: flask-app
  labels:
    app: flask-backend
spec:
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30001  # External access via minikube
    name: http
  selector:
    app: flask-backend
