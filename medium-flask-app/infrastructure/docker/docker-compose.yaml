version: '3.8'

services:
  flask-backend:
    build: 
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    ports:
      - "1000:5000"
    environment:
      FLASK_APP: /app/app.py
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 5000
    volumes:
      - ../../:/app

  streamlit-frontend:
    build: 
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    ports:
      - "8501:8501"  # Default port for Streamlit
    command: /root/.local/bin/poetry run streamlit run /app/streamlit_app.py --server.address 0.0.0.0
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ../../:/app
